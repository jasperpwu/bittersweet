[package]
name = "app"
version = "0.1.0"
description = "Bittersweet desktop client"
authors = ["Jasper Wu"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Opens the provider page in the user's real browser. Google refuses to sign
# anyone in from an embedded webview, so it cannot happen in our own window.
tauri-plugin-opener = "2"
# Throwaway 127.0.0.1 server that catches the OAuth redirect on the way back.
tauri-plugin-oauth = "2"
